[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "literature-map"
version = "0.1.0"
description = "Reproducible bibliometric maps of research fields, rebuilt monthly from OpenAlex"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Ignacio Mendoza Rojas" }]
dependencies = [
    "pandas>=2.1",
    "requests>=2.31",
    "pyyaml>=6",
    "matplotlib>=3.8",
    "networkx>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
litmap = "litmap.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/litmap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
# shared verbatim with the other repositories
exclude = ["src/litmap/figstyle.py"]

[tool.ruff.lint.per-file-ignores]
# shared verbatim with the other repositories, which use 120 columns
"src/litmap/figstyle.py" = ["E501"]
