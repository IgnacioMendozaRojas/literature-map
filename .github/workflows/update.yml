name: Monthly update

# Downloads each field from OpenAlex (open metadata, no key needed; an optional
# OPENALEX_API_KEY secret is used if present), then rebuilds the topic pages, figures,
# latest.json and the README block. Runs on the 3rd of every month (05:41 UTC).
on:
  schedule:
    - cron: "41 5 3 * *"
  push:
    paths:
      - "config/topics.yaml"
      - ".github/workflows/update.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install --no-cache-dir .
      - name: Download from OpenAlex
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: litmap fetch
      - name: Rebuild pages, figures and the latest reading
        run: litmap report
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs latest.json README.md
          git diff --cached --quiet && exit 0
          git commit -qm "Monthly update: OpenAlex snapshots, pages and figures"
          for i in 1 2 3 4 5; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep $((i * 10))
          done
          exit 1
